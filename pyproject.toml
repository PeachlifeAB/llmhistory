[project]
name = "llmhistory"
dynamic = ["version"]
description = "Export LLM conversation history (opencode, pi, claude, codex) to markdown and JSONL"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
llmhistory = "llmhistory:main"

[build-system]
requires = ["hatchling>=1.25.0", "hatch-vcs>=0.4.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "node-and-timestamp"

[tool.hatch.build.targets.wheel]
packages = ["src/llmhistory"]

[dependency-groups]
dev = ["pytest==9.0.2", "ruff==0.15.2"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "ISC001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S603", "S607", "PLR2004", "PLW1510", "RUF059", "ARG"]
"scripts/*" = ["INP001"]
"test_render.py" = ["INP001", "D", "ANN", "ARG", "T201"]
